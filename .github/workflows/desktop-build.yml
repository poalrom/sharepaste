name: Desktop Builds

# `test` gates pull requests; `build` (a ~15 minute bundle) only runs once the
# change is on main. Without a pull_request trigger the suite would only ever
# run *after* merge, which is no gate at all.
on:
  push:
    branches:
      - main
    paths:
      - clients/desktop/**
      - .github/workflows/desktop-build.yml
  pull_request:
    paths:
      - clients/desktop/**
      - .github/workflows/desktop-build.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test desktop app (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}

    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-2025]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 25
          cache: npm
          cache-dependency-path: clients/desktop/ui/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run Rust unit tests
        run: cargo test --lib --manifest-path clients/desktop/src-tauri/Cargo.toml

      # Separate crate and separate invocation on purpose: it links Tauri's mock
      # runtime, which cannot coexist with wry in one test binary, and Cargo
      # unifies features across a build graph. See acl-tests/Cargo.toml.
      - name: Run ACL regression tests
        run: cargo test --manifest-path clients/desktop/acl-tests/Cargo.toml

      - name: Install desktop UI dependencies
        run: npm --prefix clients/desktop/ui ci

      - name: Run UI tests
        run: npm --prefix clients/desktop/ui test

  build:
    name: Build desktop app (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    needs: test
    # Bundling takes ~15 minutes per platform and produces artifacts nobody
    # consumes from a PR. Gate merges on `test`; bundle once it is on main.
    if: github.event_name != 'pull_request'

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --bundles app,dmg
          - platform: windows-2025
            args: --bundles nsis

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 25
          cache: npm
          cache-dependency-path: |
            clients/desktop/package-lock.json
            clients/desktop/ui/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install desktop dependencies
        run: npm --prefix clients/desktop ci

      - name: Install desktop UI dependencies
        run: npm --prefix clients/desktop/ui ci

      - name: Build desktop app
        uses: tauri-apps/tauri-action@action-v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: clients/desktop
          tauriScript: npm run tauri
          args: ${{ matrix.args }}

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v7
        with:
          name: sharepaste-desktop-${{ matrix.platform }}
          path: |
            clients/desktop/src-tauri/target/release/bundle/**/*.dmg
            clients/desktop/src-tauri/target/release/bundle/**/*.app.tar.gz
            clients/desktop/src-tauri/target/release/bundle/**/*.exe
          if-no-files-found: error

  # Opt-in: the live-server tests need the compose stack, so they run on
  # workflow_dispatch and on pushes that touch the client's HTTP or pairing
  # code. They deliberately do not gate `build`.
  integration-filter:
    name: Decide whether to run integration tests
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Decide
        id: decide
        shell: bash
        run: |
          # No pipefail: `grep -q` exiting early can SIGPIPE `git diff`, and a
          # match must not be misread as a failed pipeline.
          set -eu

          # Pick the commit to diff against: the pushed-from SHA, or the PR base.
          # Without the pull_request arm every PR would fall through to the
          # always-run branch below and spin up a compose stack it does not need.
          case '${{ github.event_name }}' in
            push)         base='${{ github.event.before }}' ;;
            pull_request) base='${{ github.event.pull_request.base.sha }}' ;;
            *)            base='' ;;
          esac

          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            # Manual dispatch, a new branch, or a force-push we cannot diff.
            echo 'run=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --name-only "$base" '${{ github.sha }}' \
               | grep -Eq '^clients/desktop/src-tauri/src/core/(http|pairing)/'; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
            echo 'No changes under core/http or core/pairing; integration tests skipped.'
          fi

  integration:
    name: Live-server integration tests
    runs-on: ubuntu-latest
    needs: integration-filter
    if: needs.integration-filter.outputs.run == 'true'

    env:
      SHAREPASTE_TEST_SERVER: http://127.0.0.1:8443

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      # `db/` is gitignored, so a fresh checkout does not have it and Docker
      # creates the bind-mount target as root. The image runs as `node`
      # (uid 1000), so the server dies on boot with SQLITE_CANTOPEN and never
      # answers /healthz. Docker Desktop on macOS/Windows masks this by
      # ignoring ownership on bind mounts; native Linux does not, which means
      # `docker compose up` also fails on a fresh clone on any Linux host.
      # Tracked for a real fix server-side; this unblocks CI.
      - name: Create a writable database volume
        run: mkdir -p db && sudo chown -R 1000:1000 db

      - name: Start the server stack
        run: docker compose up -d --build

      - name: Wait for the server to become healthy
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            if curl -fsS "$SHAREPASTE_TEST_SERVER/healthz" >/dev/null 2>&1; then
              echo "server healthy after ${attempt}s"
              exit 0
            fi
            sleep 1
          done
          echo "server never answered /healthz within 90s" >&2
          exit 1

      - name: Run live-server integration tests
        run: |
          cargo test --manifest-path clients/desktop/src-tauri/Cargo.toml \
            --test flow1_invite --test flow2_pairing

      - name: Dump server logs on failure
        if: failure()
        run: docker compose logs --no-color sharepaste
