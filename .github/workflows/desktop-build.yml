name: Desktop Builds

# `test` and `android-guards` gate pull requests; `build` (a ~15 minute bundle)
# and `build-android` only run once the change is on main. Without a
# pull_request trigger the suite would only ever run *after* merge, which is no
# gate at all.
on:
  push:
    branches:
      - main
    paths:
      - clients/**
      - .github/workflows/desktop-build.yml
      - .github/scripts/**
      - .github/release-body-header.md
      - .github/sidestore-source.json
  pull_request:
    paths:
      - clients/**
      - .github/workflows/desktop-build.yml
      - .github/scripts/**
      - .github/release-body-header.md
      - .github/sidestore-source.json
  workflow_dispatch:

permissions:
  contents: read

# Two version changes landing seconds apart must queue rather than race: both
# would otherwise read "no tag yet" and try to create the same release.
concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Whether this commit is a release, and — if it is — whether the tree is fit
  # to be one.
  #
  # The job runs on every event because `integration-filter` needs it, and a
  # skipped dependency skips its dependents: gating the job itself on `push`
  # would have taken the pull_request and workflow_dispatch arms of that filter
  # with it. Only a push reaches the guard or can set `publish`, which is what
  # keeps this workflow safe to exercise by hand.
  release-gate:
    name: Release gate
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
      version: ${{ steps.versions.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          # Tags are what "already released" means below, and a shallow clone
          # brings none.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 25

      # Only on a push, because only a push can publish. A pull request that
      # has not yet bumped the changelog is not a broken release, it is not a
      # release at all.
      #
      # Fails on drift between tauri.conf.json, package.json and the two
      # Cargo.toml files, or on a version with no changelog section. Not
      # cosmetic: clients/core/src/http/client.rs builds the Relay User-Agent
      # from CARGO_PKG_VERSION.
      - name: Check the version numbers agree
        id: versions
        if: github.event_name == 'push'
        run: node .github/scripts/check-versions.mjs .

      # On every event, unlike the version check above, and the difference is
      # not an oversight. A changelog that has not been bumped yet is not a
      # broken release, it is a pull request; three FUI palettes that disagree
      # are a bug on whichever client is wrong, and the moment to say so is
      # while somebody is looking at the diff that caused it.
      #
      # Colours only. The script's own failure output says what that leaves
      # uncovered, because that is where the claim will be read.
      - name: Check the FUI palettes agree
        run: node .github/scripts/check-tokens.mjs .

      - name: Decide
        id: decide
        shell: bash
        run: |
          set -euo pipefail
          version='${{ steps.versions.outputs.version }}'

          if [ '${{ github.event_name }}' != 'push' ]; then
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            echo "::notice::A ${{ github.event_name }} run never publishes."
            exit 0
          fi

          # A version change publishes; every other green main build does not.
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            echo "::notice::v$version is already tagged; this commit is not a release."
          else
            echo 'publish=true' >> "$GITHUB_OUTPUT"
            echo "::notice::v$version has no tag; this commit publishes it."
          fi

  test:
    name: Test desktop app (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}

    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-2025]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 25
          cache: npm
          cache-dependency-path: clients/desktop/ui/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      # The workspace, not the desktop crate: the core's tests are the larger
      # half of the suite and were invisible to a desktop-only invocation.
      # `default-members` in clients/Cargo.toml keeps the ACL crate out of this
      # build graph, which is what makes the separate invocation below safe.
      - name: Run Rust unit tests
        run: cargo test --lib --manifest-path clients/Cargo.toml

      # Separate crate and separate invocation on purpose: it links Tauri's mock
      # runtime, which cannot coexist with wry in one test binary, and Cargo
      # unifies features across a build graph. See acl-tests/Cargo.toml.
      - name: Run ACL regression tests
        run: cargo test --manifest-path clients/desktop/acl-tests/Cargo.toml

      - name: Install desktop UI dependencies
        run: npm --prefix clients/desktop/ui ci

      - name: Run UI tests
        run: npm --prefix clients/desktop/ui test

  build:
    name: Build desktop app (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    needs: test
    # Bundling takes ~15 minutes per platform and produces artifacts nobody
    # consumes from a PR. Gate merges on `test`; bundle once it is on main.
    if: github.event_name != 'pull_request'

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --bundles app,dmg
          - platform: windows-2025
            args: --bundles nsis

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 25
          cache: npm
          cache-dependency-path: |
            clients/desktop/package-lock.json
            clients/desktop/ui/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install desktop dependencies
        run: npm --prefix clients/desktop ci

      - name: Install desktop UI dependencies
        run: npm --prefix clients/desktop/ui ci

      # No `tagName` or `releaseId`: without them tauri-action builds and
      # uploads nothing to a release, which is what we want. `publish` owns the
      # release, and `latest.json` with it — see the note in that job.
      - name: Build desktop app
        uses: tauri-apps/tauri-action@action-v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater archives. Without these the archives build but
          # carry no `.sig`, and the upload below fails on the missing pattern.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: clients/desktop
          tauriScript: npm run tauri
          args: ${{ matrix.args }}

      # Five files across the two platforms. macOS separates the two downloads —
      # `.dmg` for a human, `.app.tar.gz` for the updater — while on Windows the
      # NSIS `-setup.exe` is both, and the bundler signs it directly rather than
      # emitting the `.nsis.zip` that Tauri 1 used.
      #
      # `if-no-files-found: error` only fires when *none* of these match, and the
      # installer always does, so it is the `publish` job's per-pattern check
      # that actually catches a half-built release. It has already earned its
      # keep once, on exactly this mistake.
      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v7
        with:
          name: sharepaste-desktop-${{ matrix.platform }}
          # The workspace root is `clients/`, so Cargo — and with it the Tauri
          # bundler — writes to `clients/target/`, not to a target directory
          # under the app crate.
          path: |
            clients/target/release/bundle/**/*.dmg
            clients/target/release/bundle/**/*.app.tar.gz
            clients/target/release/bundle/**/*.app.tar.gz.sig
            clients/target/release/bundle/**/*.exe
            clients/target/release/bundle/**/*.exe.sig
          if-no-files-found: error

  # The Android guards — and the only job that compiles Kotlin on a pull request.
  #
  # No emulator and no device. `:app:testDebugUnitTest` runs the whole JVM source
  # set — every `@Test` under `app/src/test/kotlin`, including whatever has been
  # added there since this comment — and `:app:compileDebugAndroidTestKotlin`
  # type-checks the instrumented set without running it. There is deliberately no
  # test count here: the first version of this comment said "nine", two files
  # arrived, and it was wrong by fifteen with nothing to notice.
  #
  # The guards the record leans on are the ones that read the *merged* manifest:
  # all of `MergedManifestTest`, and, in `SettingsThatDoNotExistTest`, only
  # `nothing_offers_a_biometric_gate` — that class's other assertions read
  # `strings.xml`. What a merged-manifest assertion catches is a library
  # contributing `FOREGROUND_SERVICE`, `USE_BIOMETRIC` or `allowBackup="true"`
  # with not a line changing in this project's own manifest. An AndroidX bump is
  # exactly how that arrives, and a bump arrives in a pull request.
  #
  # Its own job, and neither of the two places it looks like it belongs:
  #
  # - Not steps of `test`. That matrix is macOS + Windows, billed at 10x and 2x a
  #   Linux minute, and these assertions need neither OS. Adding them there
  #   installs an Android SDK, a pinned NDK and cargo-ndk twice and runs the same
  #   source set twice for one bit of information.
  # - Not steps of `build-android`. That job is
  #   `if: github.event_name != 'pull_request'`, which is precisely the event
  #   where the guard is wanted.
  #
  # No `needs`, so it starts alongside `test` rather than behind it: a manifest
  # guard says nothing about the desktop suite, and queueing behind a macOS
  # matrix would add that matrix's whole duration to the feedback loop for
  # nothing. `publish` needs this job, so no signed APK is released past a failed
  # guard. `build-android` deliberately does *not* — see the note there.
  android-guards:
    name: Android guards (JVM)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          # AndroidX, Compose and the wrapper itself are a hundred-odd downloads
          # this job would otherwise repeat every run. `build-android` is left
          # uncached on purpose: its cost is the release cross-compile and
          # packaging rather than dependency resolution, and two jobs writing one
          # cache key is a race bought for nothing.
          cache: gradle

      # The same pin, for the same reason, as `build-android`: the NDK is a
      # compile-time input to every `.so` and the runner image's default moves
      # between image releases. `build-tools` tracks `buildToolsVersion` in the
      # Gradle build.
      - name: Install the pinned Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          # A here-string, never a pipe — see the same step in `build-android`
          # for why `yes |` fails under `pipefail` and a bounded producer does too.
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            'ndk;27.2.12479018' 'platforms;android-35' 'build-tools;36.0.0' \
            <<< "$(printf 'y\n%.0s' $(seq 1 50))"

      # A JVM test still needs the native library built. `testDebugUnitTest`
      # depends on `compileDebugKotlin`, which consumes the UniFFI bindings,
      # which are generated out of a *built* `libsharepaste_ffi.so` — see
      # `generateUniffiBindingsDebug` in `clients/mobile/android/app/build.gradle.kts`.
      # So the guards are cheap but their prerequisite is not, and this job
      # carries the same Rust toolchain as `build-android`. There is no shortcut:
      # a unit test that cannot compile the variant cannot run.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked

      # No keystore and no `-Psharepaste.ffi.features`: this is the debug
      # variant, which builds unsigned and with the `testing` feature on, and
      # neither is anything these tests read.
      #
      # `:app:compileDebugAndroidTestKotlin` is the second half of the point. The
      # 104 instrumented tests only ever run on a developer's emulator, so
      # compiling them here is the difference between a broken instrumented suite
      # being found now and being found by whoever next boots an AVD. It costs
      # one Kotlin compile against a variant this job has already built.
      #
      # `sh gradlew`, not `./gradlew`: Git on Windows does not record an exec
      # bit, so a re-add of the wrapper from a Windows checkout silently drops
      # mode 100755 and CI fails with "Permission denied" before Gradle is
      # reached — a CI-only error that reads like a runner problem. The mode is
      # correct in the index today; this is what keeps it from mattering when it
      # is not. The wrapper's shebang is `#!/bin/sh`, so this is equivalent.
      # `build-android` does the same, for the same reason.
      - name: Run the Android JVM tests and compile the instrumented sources
        working-directory: clients/mobile/android
        run: sh gradlew --no-daemon :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin

      # Gradle's console prints the failing test's name and none of its message,
      # and for these tests the message *is* the finding — "the merged manifest
      # declares android.permission.FOREGROUND_SERVICE" is the whole value of the
      # run. Without the report a red guard says only which line threw.
      #
      # `warn`, not `error`: a failure in the Kotlin compile above produces no
      # test report at all, and that must not be reported as a missing artifact.
      - name: Upload the test report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-guard-report
          path: clients/mobile/android/app/build/reports/tests/testDebugUnitTest
          if-no-files-found: warn

  # The Android artifact. A separate job rather than a third entry in `build`'s
  # matrix: it needs the Android SDK, a pinned NDK and two Rust
  # cross-compilation targets, and none of that belongs on a runner whose job is
  # to bundle a desktop app.
  #
  # Ubuntu on purpose. The desktop crate compiles only on macOS and Windows —
  # `keyring` is declared for those two targets — but nothing here builds the
  # desktop crate. `sharepaste-core` and `sharepaste-ffi` cross-compile to
  # Android from any host, so this takes the cheapest minute available.
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: test
    # Same reasoning as `build`: an artifact nobody consumes from a pull
    # request. `test` and `android-guards` are what gate the merge.
    #
    # Not `needs: android-guards`, deliberately. Both jobs cross-compile
    # sharepaste-ffi for two ABIs, so chaining them would put one Android
    # cross-compile in front of the other and buy nothing: `publish` already
    # needs `android-guards`, so a failed guard cannot release this APK however
    # cleanly it built.
    if: github.event_name != 'pull_request'

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 25

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # The exact NDK the Gradle build pins (`ndkVersionPinned`), installed
      # rather than assumed: the runner image's default NDK moves between image
      # releases, and the NDK is a compile-time input to every `.so` in the APK.
      - name: Install the pinned Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          # A here-string, never a pipe. sdkmanager stops reading stdin as soon
          # as it has its answers — and reads none at all when the licences are
          # already accepted — so any producer piped into it dies of SIGPIPE and
          # `pipefail` turns that into a failed step. Seen for real on the first
          # CI run: "yes: standard output: Broken pipe", exit 1, after the NDK
          # had unzipped to 100%. A bounded `printf` is NOT a fix; measured, it
          # still exits 141, because the race is when the reader closes the pipe
          # rather than how much the writer had left to write. A here-string is
          # a file descriptor, so there is no pipe to break. `integration-filter`
          # below records the same trap from the other direction.
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            'ndk;27.2.12479018' 'platforms;android-35' 'build-tools;36.0.0' \
            <<< "$(printf 'y\n%.0s' $(seq 1 50))"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # The two ABIs the release carries. `armeabi-v7a` and `x86` are
          # excluded on purpose; see `shippedAbis` in the Gradle build.
          targets: aarch64-linux-android,x86_64-linux-android

      # Version-pinned and `--locked`: this program chooses the linker and the
      # sysroot for the library that ships, so "whatever released this morning"
      # is not an acceptable answer for what built it.
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked

      # The keystore is a secret and never a file in this repository. It is
      # decoded into the runner's temp directory, which the runner takes with it.
      #
      # The emptiness check is not defensive padding: an unset secret expands to
      # an empty string, `base64 -d` of which is a zero-byte file that exists, so
      # Gradle would accept it as a keystore and fail several tasks later with a
      # message about a truncated archive.
      - name: Materialise the release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo 'ANDROID_KEYSTORE_BASE64 is not set. An unsigned APK cannot install over' >&2
            echo 'or be updated by a signed one, so this is a failure and not a fallback.' >&2
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks"

      # Prove the four secrets open the keystore before spending nine minutes
      # cross-compiling two ABIs to find out. AGP checks them in
      # `:app:packageRelease`, which is the *last* task in the build, so a wrong
      # password costs a full run and reports itself from inside a Gradle worker
      # as "Failed to read key *** from store" — accurate, and buried.
      #
      # Seen for real on the first push to main after the secrets were added.
      #
      # What it proves, measured rather than assumed against scratch keystores.
      #
      # `keytool -list` rejects a wrong store password and a wrong alias. It does
      # NOT validate the key password — for a JKS it falls back to the store
      # password for the entry, and `-certreq` and `-importkeystore` behave the
      # same. `jarsigner` refuses even correct credentials on JDK 25, so it is no
      # use as a probe either.
      #
      # The PKCS12 comparison below covers the gap for every keystore made this
      # decade. `keytool -genkeypair` has defaulted to PKCS12 since JDK 9, and
      # PKCS12 cannot hold a separate key password — keytool prints "Different
      # store and key passwords not supported for PKCS12 KeyStores. Ignoring
      # user-specified -keypass value" and stores the key under the store
      # password. So for a PKCS12 store the two secrets MUST match, and if they
      # do not, AGP fails in `packageRelease` with "Get Key failed: Given final
      # block not properly padded". That is exactly how this was found: a
      # nine-minute build to learn that two secrets disagreed.
      #
      # A genuine JKS with a mismatched key password is still only caught late.
      # It would have to have been made deliberately, with `-storetype jks`.
      #
      # Output is captured, not printed: a successful listing prints the
      # certificate fingerprint, and nothing about a signing key belongs in a
      # public log. Both streams go to the file, because keytool does not put all
      # of its diagnostics on stderr.
      - name: Check the signing credentials open the keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "$name is not set; the release APK would build unsigned." >&2
              exit 1
            fi
          done

          # Two invocations, because `-list` prints "Keystore type:" only when it
          # lists the whole store — add `-alias` and the output is just that one
          # entry, with or without `-v`. Measured; the single-call version of this
          # step extracted an empty type and the guard below silently never fired.
          if ! keytool -list \
                 -keystore "$RUNNER_TEMP/release.jks" \
                 -storepass "$ANDROID_KEYSTORE_PASSWORD" \
                 >"$RUNNER_TEMP/keytool.out" 2>&1; then
            echo 'ANDROID_KEYSTORE_PASSWORD does not open the keystore.' >&2
            echo 'keytool said:' >&2
            sed 's/^/  /' "$RUNNER_TEMP/keytool.out" >&2
            echo >&2
            echo 'Often a trailing newline rather than a wrong password:' >&2
            echo '`echo pw | gh secret set X` stores "pw\n". Re-set with `gh secret set X`' >&2
            echo 'on its own, which prompts, or `printf %s "$pw" | gh secret set X`.' >&2
            exit 1
          fi
          store_type="$(sed -n 's/^Keystore type: *//p' "$RUNNER_TEMP/keytool.out" | head -1)"

          if ! keytool -list \
                 -keystore "$RUNNER_TEMP/release.jks" \
                 -storepass "$ANDROID_KEYSTORE_PASSWORD" \
                 -alias "$ANDROID_KEY_ALIAS" \
                 >"$RUNNER_TEMP/alias.out" 2>&1; then
            echo "ANDROID_KEY_ALIAS ($ANDROID_KEY_ALIAS) is not in the keystore." >&2
            sed 's/^/  /' "$RUNNER_TEMP/alias.out" >&2
            exit 1
          fi

          # A PKCS12 store keeps the key under the store password, so two
          # different secrets cannot both be right.
          if [ "${store_type^^}" = 'PKCS12' ] \
             && [ "$ANDROID_KEY_PASSWORD" != "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo 'This keystore is PKCS12, which cannot hold a separate key password:' >&2
            echo 'keytool ignores -keypass for PKCS12 and stores the key under the store' >&2
            echo 'password. ANDROID_KEY_PASSWORD and ANDROID_KEYSTORE_PASSWORD therefore have' >&2
            echo 'to be the same value, and they are not.' >&2
            echo >&2
            echo 'Set ANDROID_KEY_PASSWORD to the store password:' >&2
            echo '  printf %s "$store_password" | gh secret set ANDROID_KEY_PASSWORD' >&2
            echo >&2
            echo 'Left alone, AGP fails in :app:packageRelease with' >&2
            echo '"Get Key failed: Given final block not properly padded".' >&2
            exit 1
          fi

          echo "Signing credentials verified against the keystore (${store_type:-type unknown})."

      # One universal APK carrying both shipped ABIs. The `testing` Cargo feature
      # is off in this variant by the build file's own decision, not by a flag
      # passed here — see `ffiFeaturesFor`.
      - name: Build the signed universal APK
        working-directory: clients/mobile/android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: sh gradlew --no-daemon :app:assembleRelease

      # AGP calls it `app-release.apk`, which is not a name to put on a Release
      # page beside five desktop bundles. Two things are load-bearing here:
      #
      # - The version comes from `tauri.conf.json`, the authority
      #   `check-versions.mjs` has already proved the Gradle `versionName` agrees
      #   with, so this cannot name the APK a version it is not.
      # - `app-release.apk` is the *signed* name. AGP writes
      #   `app-release-unsigned.apk` when it has no signing config, so this
      #   `test -f` is also the assertion that the secrets took effect.
      #
      # `-universal` rather than an ABI in the name: Obtainium has a per-app
      # setting that tries to pick an APK by CPU architecture out of the file
      # name, and a name carrying `arm64` would invite it to guess. There is one
      # APK and it runs everywhere.
      - name: Name the artifact
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./clients/desktop/src-tauri/tauri.conf.json').version")"
          built=clients/mobile/android/app/build/outputs/apk/release/app-release.apk
          test -f "$built"
          mkdir -p android-artifact
          cp "$built" "android-artifact/sharepaste-$version-universal.apk"

      - name: Upload the Android artifact
        uses: actions/upload-artifact@v7
        with:
          name: sharepaste-android
          path: android-artifact/*.apk
          if-no-files-found: error

  # The iOS guards, and the only job that compiles Swift.
  #
  # It is `android-guards`' opposite number in intent and nothing like it in
  # shape, because the two platforms give away different things for free.
  # Android's instrumented suite cannot run in CI at all — an emulator on a
  # Linux runner is the flakiest thing available — so that job compiles the
  # instrumented sources and runs the JVM tests. Here the simulator *is* the
  # runner's own machine, and the relay is a Node process beside it, so the
  # dozen facade classes spec row 10 buys actually execute.
  #
  # macOS on purpose, and expensively: cross-compiling `rusqlite`'s vendored C
  # SQLite for an Apple target needs Apple's own clang and sysroot, and the
  # simulator needs a Mac by definition.
  #
  # `xcodebuild` appears here and nowhere else. Ticket 01 forbade it for the
  # *artifact shape* — no `.xcodeproj`, no xcframework, nothing generated that
  # the two build paths would then have to agree about — and this is neither:
  # the package is still built by SwiftPM from the one committed manifest.
  # There is simply no supported way to install and run an XCTest bundle on a
  # simulator from SwiftPM alone; `swift test` builds for the host.
  ios-facade-tests:
    name: iOS facade tests (simulator)
    runs-on: macos-latest
    # The tests are minutes, but `ExpiredCodeTest` waits out a real 120-second
    # pairing slot and the Rust cross-compile is two targets from cold.
    timeout-minutes: 45

    env:
      SHAREPASTE_TEST_DB: ${{ github.workspace }}/ios-ci-server.sqlite
      # The simulator shares the host's network stack, so the host's loopback
      # is the loopback. There is no emulator alias to special-case, which is
      # the one place this arrangement is simpler than Android's.
      SHAREPASTE_RELAY_URL: http://127.0.0.1:8443
      # Pinned, not floated. `actions/runner-images#13853` shows simulator
      # runtimes occasionally lagging a new Xcode by weeks, and a job that
      # silently stops running is worse than one that fails. When this stops
      # matching the image, bump it here deliberately.
      IOS_RUNTIME: "26.5"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 25
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # Both slices from one job: the simulator one is linked into the
          # tests below, and the device one is what `xtool dev` links on the
          # desk and what `build-ios` ships. They are built together because
          # the bindings are generated once and have to match both.
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      # Three minutes of vendored SQLite per run, twice over, is worth a cache.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients

      - name: Build the static library for both slices
        env:
          # Without this rustc takes the deployment target from the SDK, which
          # stamped `minos 26.5` on the device slice during the spike — an app
          # nothing in anyone's hands could run. The floor is iOS 16, carried
          # from the mobile-client ledger, and it has to be said out loud.
          IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        run: |
          set -euo pipefail
          for target in aarch64-apple-ios aarch64-apple-ios-sim; do
            cargo build \
              --manifest-path clients/Cargo.toml \
              -p sharepaste-ffi \
              --release \
              --features testing \
              --target "$target"
          done

      # From the *built archive*, never from the sources, which is what makes a
      # bindings/library mismatch impossible. The Android build follows the same
      # rule with `generateUniffiBindingsDebug`.
      - name: Generate the Swift bindings from the built archive
        # `cargo metadata` resolves against the working directory and the
        # workspace is `clients/`, not the repository root. The Android build
        # says the same thing as `workingDir = rustWorkspace`.
        working-directory: clients
        run: |
          set -euo pipefail
          mkdir -p ../ios-artifact/generated
          cargo run \
            --quiet \
            -p sharepaste-ffi --features cli --bin uniffi-bindgen \
            -- generate --language swift --no-format \
            --out-dir ../ios-artifact/generated \
            target/aarch64-apple-ios-sim/release/libsharepaste_ffi.a

      # Uploaded before the tests run rather than after them. The desk fetches
      # this artifact with `make ios-vendor` and a failing test must still leave
      # something to build against — otherwise the one way to reproduce the
      # failure locally is the thing the failure takes away.
      - name: Publish both slices and the bindings
        run: |
          set -euo pipefail
          mkdir -p ios-artifact/device ios-artifact/simulator
          cp clients/target/aarch64-apple-ios/release/libsharepaste_ffi.a ios-artifact/device/
          cp clients/target/aarch64-apple-ios-sim/release/libsharepaste_ffi.a ios-artifact/simulator/
          ls -l ios-artifact/device ios-artifact/simulator ios-artifact/generated

      - name: Upload the iOS static library
        uses: actions/upload-artifact@v7
        with:
          # The batch contract, and the layout `make ios-vendor` copies from.
          # Not prefixed `sharepaste-`: `publish` downloads that pattern, and a
          # 40 MB archive of build inputs is not a release asset.
          name: ios-static-library
          path: |
            ios-artifact/device/libsharepaste_ffi.a
            ios-artifact/simulator/libsharepaste_ffi.a
            ios-artifact/generated/
          if-no-files-found: error

      # What `make ios-vendor IOS_SLICE=simulator` does, without the round trip
      # through the artifact store. `Package.swift` knows nothing about which
      # slice it got — that is the entire mechanism spec row 6 buys, and it is
      # why no xcframework is needed to test on a simulator and ship to a device
      # from one manifest.
      - name: Vendor the simulator slice into the package
        run: |
          set -euo pipefail
          ios=clients/mobile/ios
          mkdir -p "$ios/Vendor" "$ios/Sources/sharepaste_ffiFFI" "$ios/Sources/SharepasteCore"
          cp ios-artifact/simulator/libsharepaste_ffi.a "$ios/Vendor/"
          cp ios-artifact/generated/sharepaste_ffi.swift "$ios/Sources/SharepasteCore/"
          cp ios-artifact/generated/sharepaste_ffiFFI.h "$ios/Sources/sharepaste_ffiFFI/"
          cp ios-artifact/generated/sharepaste_ffiFFI.modulemap \
            "$ios/Sources/sharepaste_ffiFFI/module.modulemap"

      # Natively, not in docker: macOS runners cannot run Linux containers,
      # which the `integration` job below already records as the reason it is
      # shaped the way it is. `server/` is Node, so the runner starts it
      # directly.
      #
      # Ticket 08 asks for `npm start`, and that is not runnable as written:
      # `server/package.json` defines `start` as `tsx src/index.ts`, which
      # passes no subcommand, and the relay needs `serve`. Adding a subcommand
      # to somebody else's npm script from a CI job would be worse than the
      # divergence. The substance of the criterion — the relay runs natively on
      # the runner, and no docker is invoked — is met exactly; the letter of it
      # is not, and this is that said out loud.
      - name: Build the relay
        run: npm --prefix server ci && npm --prefix server run build

      - name: Start the relay
        run: |
          DB_PATH="$SHAREPASTE_TEST_DB" PORT=8443 \
            node server/dist/index.js serve > "$RUNNER_TEMP/server.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/server.pid"

      - name: Wait for the relay to become healthy
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl -fsS "$SHAREPASTE_RELAY_URL/healthz" >/dev/null 2>&1; then
              echo "relay healthy after ${attempt}s"
              exit 0
            fi
            sleep 1
          done
          echo "the relay never answered /healthz within 60s" >&2
          exit 1

      - name: Mint invite tokens
        shell: bash
        run: |
          set -euo pipefail
          # Deliberately far more than a run needs, and deliberately not a count
          # maintained against a list of tests.
          #
          # An invite is single-use — the relay answers a second claim with 409 —
          # and a process needs four: the run's inviting device
          # (`Inviter.shared`), the second User for `TwoPairingsTest`
          # (`Inviter.second`), `SessionEventsTest`'s own facade, and the
          # inviter `PendingOnANonActivePairingTest` claims through its proxy.
          # The first version of this step minted exactly those four and the run
          # ran out, for two reasons worth writing down: the list of claiming
          # tests grows without this file being touched, and `xcodebuild`
          # relaunches a bundle that crashed and re-runs what had not finished,
          # so one process's four can be spent several times over.
          #
          # Twenty-four costs twenty-four rows in a SQLite file the runner
          # deletes with itself, and buys five full re-runs. Running out is no
          # longer fatal either — `Suite.nextInvite` throws and names the claim
          # that asked — so an exhausted pool now fails one test with a sentence
          # instead of taking the process down and consuming more on the way.
          tokens=""
          for n in $(seq 1 24); do
            token="$(node server/dist/index.js user create "ios-ci-$n" --db "$SHAREPASTE_TEST_DB" \
              | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).invite_token")"
            tokens="${tokens:+$tokens,}$token"
          done

          # Written into the test bundle's own resources, NOT passed as an
          # environment variable.
          #
          # `TEST_RUNNER_`-prefixed build settings are the documented route into
          # a test process's environment and they do not arrive in a bundle with
          # no host application. Measured twice: on both runs this step held
          # every token it had minted and the suite read an empty list. It went
          # unnoticed for a whole run because the relay address has a correct
          # default and the invite list cannot have one, so only the invites
          # ever reported it — the first run's "out of invite tokens" was the
          # *first* claim failing, not the fifth.
          #
          # A resource has no semantics to get wrong: it is a file, in the
          # bundle, that `Bundle.module` finds. The tree carries a copy with an
          # empty list so the manifest is always valid; this overwrites it
          # before anything is built.
          node -e '
            const fs = require("node:fs");
            const path = "clients/mobile/ios/Tests/SharepasteFacadeTests/Resources/harness.json";
            const invites = process.argv[1].split(",").filter(Boolean);
            fs.writeFileSync(path, JSON.stringify({
              _comment: "Written by the ios-facade-tests job. The committed copy carries an empty invite list.",
              relayURL: process.argv[2],
              invites,
            }, null, 2) + "\n");
            console.log(`baked ${invites.length} invite tokens into ${path}`);
          ' "$tokens" "$SHAREPASTE_RELAY_URL"

      # The runtime is pinned; the device model is not, because the model is
      # cosmetic and the runtime is what disappears. Picking from the runtime's
      # own `supportedDeviceTypes` is what keeps the two from contradicting each
      # other after an image bump.
      - name: Boot a simulator on the pinned runtime
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list runtimes
          # Both halves come out of the same JSON: reconstructing the runtime
          # identifier from the version string would be a second opinion about
          # Apple's naming, and the newest iPhone the runtime itself declares
          # support for cannot contradict it.
          read -r device_type runtime_id < <(xcrun simctl list runtimes -j | python3 -c '
          import json, sys, os
          wanted = os.environ["IOS_RUNTIME"]
          runtimes = json.load(sys.stdin)["runtimes"]
          available = [
              r for r in runtimes
              if r["platform"] == "iOS" and r["version"] == wanted and r["isAvailable"]
          ]
          phones = [
              d for r in available for d in r["supportedDeviceTypes"] if "iPhone" in d["identifier"]
          ]
          if not available or not phones:
              have = ", ".join(sorted(r["version"] for r in runtimes if r["platform"] == "iOS"))
              sys.exit(
                  f"no usable iOS {wanted} simulator runtime on this image (it has: {have}).\n"
                  "The pin is IOS_RUNTIME in this job. Runtimes lag a new Xcode "
                  "(actions/runner-images#13853), so bump it deliberately rather than floating it."
              )
          print(phones[-1]["identifier"], available[0]["identifier"])
          ')
          echo "booting $device_type on $runtime_id"
          udid="$(xcrun simctl create sharepaste-tests "$device_type" "$runtime_id")"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"

      # No `TEST_RUNNER_` settings here any more. They are the documented route
      # into a test process's environment and they do not reach a bundle with no
      # host application — see the mint step, which now bakes the relay address
      # and the tokens into the bundle's own resources instead. A route that
      # silently delivers nothing is worse than no route, so it is gone rather
      # than kept as a belt.
      #
      # `ARCHS=arm64`, because `Vendor/` holds exactly one slice and it is the
      # arm64 simulator one. On an Intel runner this fails at the link with
      # undefined symbols rather than building something that cannot run.
      - name: Run the facade tests
        working-directory: clients/mobile/ios
        shell: bash
        run: |
          set -euo pipefail
          scheme="$(xcodebuild -list -json | python3 -c '
          import json, sys
          listing = json.load(sys.stdin)
          schemes = (listing.get("workspace") or listing.get("project"))["schemes"]
          print(next((s for s in schemes if s.endswith("-Package")), schemes[0]))
          ')"
          echo "scheme: $scheme"
          # `-test-timeouts-enabled` is not belt and braces; it is the only
          # thing that can end a hang here. Every wait the suite writes for
          # itself is bounded, but a blocking call inside the FFI boundary is
          # not interruptible from the Swift side, and one `UIPasteboard` read
          # with nobody to answer its permission prompt held this job for
          # thirty-six minutes until a human cancelled it. With this, the same
          # hang is one red test with a backtrace naming the frame, two minutes
          # in — which is also how the *next* unknown blocking call gets
          # diagnosed instead of cancelled.
          #
          # The maximum is above the default because `ExpiredCodeTest` raises
          # its own allowance to 240s to wait out a real pairing slot; a
          # per-class `executionTimeAllowance` above the maximum is clamped
          # silently, which would fail that test for the wrong reason.
          xcodebuild test \
            -scheme "$scheme" \
            -destination "id=$SIMULATOR_UDID" \
            -only-testing:SharepasteFacadeTests \
            -resultBundlePath "$RUNNER_TEMP/ios-tests.xcresult" \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 300 \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO

      # The console prints the failing assertion and none of its context, and
      # for a suite talking to a live relay the context is most of the finding.
      # `warn`, not `error`: a failure in the Swift compile produces no result
      # bundle at all, and that must not be reported as a missing artifact.
      - name: Upload the test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-facade-test-results
          path: ${{ runner.temp }}/ios-tests.xcresult
          if-no-files-found: warn

      - name: Dump the relay log on failure
        if: failure()
        run: cat "$RUNNER_TEMP/server.log" || true

  # The iOS artifact: one unsigned `.ipa`, built by the same tool the desk uses
  # so that CI and the local loop cannot drift apart.
  #
  # **No signing happens here, and none can.** It is interactive because of
  # Apple's 2FA, and a free account has no App Store Connect API key (ADR 0008).
  # `xtool dev build` signs nothing unless a product declares entitlements, and
  # none does.
  #
  # `needs: ios-facade-tests`, which is the opposite of what `build-android`
  # does, and the reason is the artifact rather than the guard: that job already
  # publishes the device slice and the bindings under the batch contract, so
  # this one consumes them exactly as `make ios-vendor` does on the desk. A
  # second cross-compile here would produce a *different* archive from the one
  # the tests linked, for nine more minutes of macOS time.
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest
    needs: ios-facade-tests
    # Same reasoning as `build` and `build-android`: an artifact nobody consumes
    # from a pull request.
    if: github.event_name != 'pull_request'

    env:
      # Pinned, and installed from the release rather than from the Homebrew
      # cask: the cask is `version :latest` and cannot be pinned at all, and
      # this tool decides the shape of the artifact that ships.
      XTOOL_VERSION: "1.17.0"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 25

      - name: Download the iOS static library
        uses: actions/download-artifact@v7
        with:
          name: ios-static-library
          path: ios-artifact

      # `make ios-vendor` without the `gh run download`, and with the *device*
      # slice: this is what goes on the iPad. The manifest is unconditional and
      # links whatever is at this path, which is the whole reason there is no
      # xcframework anywhere in this repository.
      - name: Vendor the device slice into the package
        run: |
          set -euo pipefail
          ios=clients/mobile/ios
          mkdir -p "$ios/Vendor" "$ios/Sources/sharepaste_ffiFFI" "$ios/Sources/SharepasteCore"
          cp ios-artifact/device/libsharepaste_ffi.a "$ios/Vendor/"
          cp ios-artifact/generated/sharepaste_ffi.swift "$ios/Sources/SharepasteCore/"
          cp ios-artifact/generated/sharepaste_ffiFFI.h "$ios/Sources/sharepaste_ffiFFI/"
          cp ios-artifact/generated/sharepaste_ffiFFI.modulemap \
            "$ios/Sources/sharepaste_ffiFFI/module.modulemap"

      # The binary lives inside the app bundle, at the path the cask symlinks:
      # `xtool.app/Contents/Resources/bin/xtool`.
      - name: Install xtool
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/xtool.app.zip" \
            "https://github.com/xtool-org/xtool/releases/download/$XTOOL_VERSION/xtool.app.zip"
          unzip -q "$RUNNER_TEMP/xtool.app.zip" -d "$RUNNER_TEMP/xtool"
          echo "$RUNNER_TEMP/xtool/xtool.app/Contents/Resources/bin" >> "$GITHUB_PATH"

      - name: Show what will build it
        run: |
          xtool --version || true
          swift --version
          xcrun -sdk iphoneos --show-sdk-path

      # `--ipa` is xtool's own packaging: the `.app` under `Payload/`, zipped.
      # Hand-rolling that zip was considered and is strictly worse — it is the
      # same bytes with a second opinion about the layout, and the second
      # opinion is the one nobody tests.
      - name: Build the unsigned IPA
        working-directory: clients/mobile/ios
        run: xtool dev build --configuration release --ipa

      # `Sharepaste.ipa` is not a name to put on a Release page beside five
      # desktop bundles and an APK. The version comes from `tauri.conf.json` —
      # the authority `check-versions.mjs` has already proved the plist's
      # `CFBundleShortVersionString` agrees with — so this cannot name the `.ipa`
      # a version it is not, and SideStore compares that string exactly.
      - name: Name the artifact
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./clients/desktop/src-tauri/tauri.conf.json').version")"
          # `find`, not `shopt -s globstar`. This is the only step in the
          # workflow that runs a shell script on macOS, and macOS ships bash
          # 3.2 — `globstar` arrived in bash 4, so `**` there means one
          # directory level and `shopt` fails outright under `set -e`. The
          # publish job below uses globstar quite safely: it runs on ubuntu.
          built=()
          while IFS= read -r found; do built+=("$found"); done < <(
            find clients/mobile/ios -name '*.ipa' -type f
          )
          if [ "${#built[@]}" -ne 1 ]; then
            printf 'expected exactly one .ipa, found %d: %s\n' "${#built[@]}" "${built[*]:-none}" >&2
            exit 1
          fi
          mkdir -p ios-release
          cp "${built[0]}" "ios-release/sharepaste-$version.ipa"
          unzip -l "ios-release/sharepaste-$version.ipa" | head -20

      - name: Upload the iOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: sharepaste-ios
          path: ios-release/*.ipa
          if-no-files-found: error

  # Opt-in: the live-server tests need a relay to talk to, so they run on
  # workflow_dispatch and on pushes that touch the client's HTTP or pairing
  # code. A release commit runs them whatever it touched, because `publish`
  # needs this job and "the tests did not apply" is not evidence.
  integration-filter:
    name: Decide whether to run integration tests
    runs-on: ubuntu-latest
    needs: release-gate
    outputs:
      run: ${{ steps.decide.outputs.run }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Decide
        id: decide
        shell: bash
        run: |
          # No pipefail: `grep -q` exiting early can SIGPIPE `git diff`, and a
          # match must not be misread as a failed pipeline.
          set -eu

          if [ '${{ needs.release-gate.outputs.publish }}' = 'true' ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            echo 'Release commit; integration tests run regardless of paths.'
            exit 0
          fi

          # Pick the commit to diff against: the pushed-from SHA, or the PR base.
          # Without the pull_request arm every PR would fall through to the
          # always-run branch below and spin up a relay it does not need.
          case '${{ github.event_name }}' in
            push)         base='${{ github.event.before }}' ;;
            pull_request) base='${{ github.event.pull_request.base.sha }}' ;;
            *)            base='' ;;
          esac

          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            # Manual dispatch, a new branch, or a force-push we cannot diff.
            echo 'run=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --name-only "$base" '${{ github.sha }}' \
               | grep -Eq '^clients/core/src/(http|pairing)/'; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
            echo 'No changes under core/http or core/pairing; integration tests skipped.'
          fi

  integration:
    name: Live-server integration tests
    # macOS, not ubuntu, and no Docker. The desktop crate only compiles on
    # macOS and Windows - `keyring` is declared for those two targets only, so
    # on Linux `core/keychain.rs` fails with "cannot find crate keyring". And
    # GitHub's macOS/Windows runners cannot run Linux containers, so the
    # compose stack is not an option either. Running the server as a plain node
    # process sidesteps both, and exercises the same wire contract.
    runs-on: macos-latest
    needs: integration-filter
    if: needs.integration-filter.outputs.run == 'true'

    env:
      SHAREPASTE_TEST_SERVER: http://127.0.0.1:8443
      SHAREPASTE_TEST_DB: ${{ github.workspace }}/ci-server.sqlite

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 25
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build the server
        run: npm --prefix server ci && npm --prefix server run build

      - name: Start the server
        run: |
          DB_PATH="$SHAREPASTE_TEST_DB" PORT=8443 \
            node server/dist/index.js serve > "$RUNNER_TEMP/server.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/server.pid"

      - name: Wait for the server to become healthy
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl -fsS "$SHAREPASTE_TEST_SERVER/healthz" >/dev/null 2>&1; then
              echo "server healthy after ${attempt}s"
              exit 0
            fi
            sleep 1
          done
          echo "server never answered /healthz within 60s" >&2
          exit 1

      # SHAREPASTE_TEST_CLI makes the harness invoke the operator CLI directly
      # instead of `docker exec`. It must open the same database file the
      # server was given, hence SHAREPASTE_TEST_DB above.
      - name: Run live-server integration tests
        env:
          SHAREPASTE_TEST_CLI: node ${{ github.workspace }}/server/dist/index.js
        run: |
          cargo test --manifest-path clients/core/Cargo.toml \
            --test flow1_invite --test flow2_pairing

      - name: Dump server log on failure
        if: failure()
        run: cat "$RUNNER_TEMP/server.log" || true

  # One job, both platforms, one release. A Windows failure means no release at
  # all rather than a published mac-only one that looks complete.
  #
  # `needs` carries the whole gate: on a non-release commit `integration` is
  # skipped, which skips this job, which is the wanted outcome — so no
  # `always()` or `!cancelled()` is needed anywhere.
  #
  # `android-guards` is in that list rather than in `build-android`'s: it runs
  # concurrently with every other dependency here, so it refuses the release
  # without adding a minute to the path that produces it. `ios-facade-tests` is
  # in it for the same reason and one more: `build-ios` already needs that job
  # for its artifact, so naming it here changes no timing at all and states the
  # gate where the gate is read.
  publish:
    name: Publish v${{ needs.release-gate.outputs.version }}
    runs-on: ubuntu-latest
    needs:
      [release-gate, build, build-android, android-guards, build-ios, ios-facade-tests, integration]
    if: needs.release-gate.outputs.publish == 'true'

    # Scoped to this job alone; the workflow default stays `contents: read`.
    permissions:
      contents: write

    env:
      VERSION: ${{ needs.release-gate.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 25

      - name: Download every platform's artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          # Both jobs' names start with this, and the per-pattern check in
          # "Upload every asset" is what notices if one of them contributed
          # nothing.
          pattern: sharepaste-*

      - name: Extract the release notes
        run: node .github/scripts/changelog.mjs clients/desktop/CHANGELOG.md "$VERSION" > notes.md

      # Hand-rolled rather than tauri-action's `includeUpdaterJson`; the script
      # explains why at its head. One job writes the manifest once, with both
      # platforms already on disk.
      - name: Assemble latest.json
        run: |
          node .github/scripts/build-latest-json.mjs \
            --version "$VERSION" \
            --repo '${{ github.repository }}' \
            --notes-file notes.md \
            --artifacts artifacts \
            --out latest.json

      # The SideStore source is committed and hand-edited, so the one thing a
      # pipeline *can* check about it is checked here: that it names the release
      # being published rather than the one before it. SideStore compares
      # `version` against `CFBundleShortVersionString` case-sensitively, and a
      # source still pointing at the previous tag offers an update that installs
      # the old build over the new one.
      #
      # This is **not** the bundle-identifier check ADR 0008 rejected. That one
      # would compare the identifier in this file against `Info.plist`, and both
      # sides of that comparison are strings nobody installs: the plist holds
      # `com.sharepaste.ios` and the device holds the form xtool and SideStore
      # rewrote it into, so the check would go green while the update path was
      # broken. The identifier is proved by watching an update land, and by
      # nothing else.
      - name: Check the SideStore source is fit to publish
        shell: bash
        run: |
          set -euo pipefail
          node -e '
            const fs = require("node:fs");
            const version = process.env.VERSION;
            const expected =
              `https://github.com/${process.env.REPO}/releases/download/v${version}/sharepaste-${version}.ipa`;
            const app = JSON.parse(fs.readFileSync(".github/sidestore-source.json", "utf8")).apps[0];
            const newest = app.versions[0];

            // The blank, first. Publishing the placeholder produces exactly the
            // failure the file argues about: SideStore identifies the app by
            // this string, so a Release carrying an unfilled one offers a fresh
            // install beside the real app, with an empty database, while the
            // Pairings sit in the old one.
            //
            // This is NOT the identifier-versus-plist check ADR 0008 rejected.
            // That one would compare two strings nobody installs — the plist
            // holds `com.sharepaste.ios`, the device holds the form xtool and
            // SideStore rewrote it into — and would go green while the real path
            // was broken. This one has no opinion about what the identifier
            // should be. It refuses a blank that was never filled in, which is
            // the one state that is wrong from here without knowing anything
            // about a device.
            if (app.bundleIdentifier.includes("REPLACE-WITH-THE-INSTALLED-IDENTIFIER")) {
              console.error(".github/sidestore-source.json still carries the placeholder identifier:");
              console.error(`  apps[0].bundleIdentifier  ${app.bundleIdentifier}`);
              console.error("");
              console.error("Install the app once with SideStore, read the real identifier off the");
              console.error("device with `ideviceinstaller -l`, and commit it. Until then a Release");
              console.error("carrying this file offers a fresh install rather than an update, and the");
              console.error("Pairings stay in the app it lands beside.");
              process.exit(1);
            }

            const wrong = Object.entries({
              "apps[0].version": [app.version, version],
              "apps[0].versions[0].version": [newest.version, version],
              "apps[0].downloadURL": [app.downloadURL, expected],
              "apps[0].versions[0].downloadURL": [newest.downloadURL, expected],
            }).filter(([, [was, wanted]]) => was !== wanted);
            if (wrong.length === 0) process.exit(0);
            console.error(".github/sidestore-source.json does not name this release:");
            for (const [field, [was, wanted]] of wrong) {
              console.error(`  ${field}\n    is     ${was}\n    should ${wanted}`);
            }
            console.error("");
            console.error("Both downloadURLs and both versions are load-bearing: SideStore reads the");
            console.error("app-level pair and AltStore reads versions[]. Edit the file and re-run.");
            process.exit(1);
          '
        env:
          REPO: ${{ github.repository }}

      # Draft first. `releases/latest/download/latest.json` is polled
      # continuously by every device, so a manifest that becomes reachable
      # before the bundles it names is a manifest pointing at 404s.
      - name: Create the draft release
        run: |
          set -euo pipefail
          cat .github/release-body-header.md notes.md > body.md
          gh release create "v$VERSION" \
            --draft \
            --title "v$VERSION" \
            --notes-file body.md \
            --target '${{ github.sha }}'

      - name: Upload every asset
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          # One match per pattern, or no release. A half-built release —
          # published, plausible, and missing a platform — is worse than none,
          # and this is the only step that would notice. It has already earned
          # its keep once, on exactly that mistake.
          #
          # `*.apk` and `*.ipa` are the two phones, and they belong in this list
          # rather than in a separate `gh release upload` beside it: a phone
          # missing from a Release that names it is the same failure as a
          # missing desktop bundle, and routing around the check is how it would
          # stop being caught.
          #
          # `latest.json` is *not* in the list and is uploaded below unchecked,
          # because it is written by this job rather than downloaded. It names
          # two platform keys and neither is a phone: the desktop updater is the
          # only thing that reads it, and Obtainium and SideStore read the
          # Release itself.
          assets=()
          for pattern in '*.dmg' '*.app.tar.gz' '*.app.tar.gz.sig' \
                         '*.exe' '*.exe.sig' '*.apk' '*.ipa'; do
            # shellcheck disable=SC2206 # $pattern is a glob; expanding it is the point.
            matches=(artifacts/**/$pattern)
            if [ "${#matches[@]}" -ne 1 ]; then
              printf 'expected exactly one %s, found %d\n' "$pattern" "${#matches[@]}" >&2
              exit 1
            fi
            assets+=("${matches[0]}")
          done
          # The SideStore source travels with the Release rather than being read
          # off `raw.githubusercontent.com`, so that the URL a person pastes into
          # SideStore once —
          # `releases/latest/download/sidestore-source.json` — keeps resolving to
          # the newest published version without them re-adding it.
          gh release upload "v$VERSION" latest.json .github/sidestore-source.json "${assets[@]}"

      # Not a prerelease, even at 0.x: the `releases/latest/download` redirect
      # resolves only to non-draft, non-prerelease releases, so flagging 0.x
      # honestly would 404 the updater permanently.
      - name: Publish the release
        run: gh release edit "v$VERSION" --draft=false --latest
