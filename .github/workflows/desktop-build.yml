name: Desktop Builds

# `test` and `android-guards` gate pull requests; `build` (a ~15 minute bundle)
# and `build-android` only run once the change is on main. Without a
# pull_request trigger the suite would only ever run *after* merge, which is no
# gate at all.
on:
  push:
    branches:
      - main
    paths:
      - clients/**
      - .github/workflows/desktop-build.yml
      - .github/scripts/**
      - .github/release-body-header.md
  pull_request:
    paths:
      - clients/**
      - .github/workflows/desktop-build.yml
      - .github/scripts/**
      - .github/release-body-header.md
  workflow_dispatch:

permissions:
  contents: read

# Two version changes landing seconds apart must queue rather than race: both
# would otherwise read "no tag yet" and try to create the same release.
concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Whether this commit is a release, and — if it is — whether the tree is fit
  # to be one.
  #
  # The job runs on every event because `integration-filter` needs it, and a
  # skipped dependency skips its dependents: gating the job itself on `push`
  # would have taken the pull_request and workflow_dispatch arms of that filter
  # with it. Only a push reaches the guard or can set `publish`, which is what
  # keeps this workflow safe to exercise by hand.
  release-gate:
    name: Release gate
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
      version: ${{ steps.versions.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          # Tags are what "already released" means below, and a shallow clone
          # brings none.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 25

      # Only on a push, because only a push can publish. A pull request that
      # has not yet bumped the changelog is not a broken release, it is not a
      # release at all.
      #
      # Fails on drift between tauri.conf.json, package.json and the two
      # Cargo.toml files, or on a version with no changelog section. Not
      # cosmetic: clients/core/src/http/client.rs builds the Relay User-Agent
      # from CARGO_PKG_VERSION.
      - name: Check the version numbers agree
        id: versions
        if: github.event_name == 'push'
        run: node .github/scripts/check-versions.mjs .

      - name: Decide
        id: decide
        shell: bash
        run: |
          set -euo pipefail
          version='${{ steps.versions.outputs.version }}'

          if [ '${{ github.event_name }}' != 'push' ]; then
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            echo "::notice::A ${{ github.event_name }} run never publishes."
            exit 0
          fi

          # A version change publishes; every other green main build does not.
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            echo "::notice::v$version is already tagged; this commit is not a release."
          else
            echo 'publish=true' >> "$GITHUB_OUTPUT"
            echo "::notice::v$version has no tag; this commit publishes it."
          fi

  test:
    name: Test desktop app (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}

    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-2025]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 25
          cache: npm
          cache-dependency-path: clients/desktop/ui/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      # The workspace, not the desktop crate: the core's tests are the larger
      # half of the suite and were invisible to a desktop-only invocation.
      # `default-members` in clients/Cargo.toml keeps the ACL crate out of this
      # build graph, which is what makes the separate invocation below safe.
      - name: Run Rust unit tests
        run: cargo test --lib --manifest-path clients/Cargo.toml

      # Separate crate and separate invocation on purpose: it links Tauri's mock
      # runtime, which cannot coexist with wry in one test binary, and Cargo
      # unifies features across a build graph. See acl-tests/Cargo.toml.
      - name: Run ACL regression tests
        run: cargo test --manifest-path clients/desktop/acl-tests/Cargo.toml

      - name: Install desktop UI dependencies
        run: npm --prefix clients/desktop/ui ci

      - name: Run UI tests
        run: npm --prefix clients/desktop/ui test

  build:
    name: Build desktop app (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    needs: test
    # Bundling takes ~15 minutes per platform and produces artifacts nobody
    # consumes from a PR. Gate merges on `test`; bundle once it is on main.
    if: github.event_name != 'pull_request'

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --bundles app,dmg
          - platform: windows-2025
            args: --bundles nsis

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 25
          cache: npm
          cache-dependency-path: |
            clients/desktop/package-lock.json
            clients/desktop/ui/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install desktop dependencies
        run: npm --prefix clients/desktop ci

      - name: Install desktop UI dependencies
        run: npm --prefix clients/desktop/ui ci

      # No `tagName` or `releaseId`: without them tauri-action builds and
      # uploads nothing to a release, which is what we want. `publish` owns the
      # release, and `latest.json` with it — see the note in that job.
      - name: Build desktop app
        uses: tauri-apps/tauri-action@action-v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater archives. Without these the archives build but
          # carry no `.sig`, and the upload below fails on the missing pattern.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: clients/desktop
          tauriScript: npm run tauri
          args: ${{ matrix.args }}

      # Five files across the two platforms. macOS separates the two downloads —
      # `.dmg` for a human, `.app.tar.gz` for the updater — while on Windows the
      # NSIS `-setup.exe` is both, and the bundler signs it directly rather than
      # emitting the `.nsis.zip` that Tauri 1 used.
      #
      # `if-no-files-found: error` only fires when *none* of these match, and the
      # installer always does, so it is the `publish` job's per-pattern check
      # that actually catches a half-built release. It has already earned its
      # keep once, on exactly this mistake.
      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v7
        with:
          name: sharepaste-desktop-${{ matrix.platform }}
          # The workspace root is `clients/`, so Cargo — and with it the Tauri
          # bundler — writes to `clients/target/`, not to a target directory
          # under the app crate.
          path: |
            clients/target/release/bundle/**/*.dmg
            clients/target/release/bundle/**/*.app.tar.gz
            clients/target/release/bundle/**/*.app.tar.gz.sig
            clients/target/release/bundle/**/*.exe
            clients/target/release/bundle/**/*.exe.sig
          if-no-files-found: error

  # The Android guards — and the only job that compiles Kotlin on a pull request.
  #
  # No emulator and no device. `:app:testDebugUnitTest` runs the whole JVM source
  # set — every `@Test` under `app/src/test/kotlin`, including whatever has been
  # added there since this comment — and `:app:compileDebugAndroidTestKotlin`
  # type-checks the instrumented set without running it. There is deliberately no
  # test count here: the first version of this comment said "nine", two files
  # arrived, and it was wrong by fifteen with nothing to notice.
  #
  # The guards the record leans on are the ones that read the *merged* manifest:
  # all of `MergedManifestTest`, and, in `SettingsThatDoNotExistTest`, only
  # `nothing_offers_a_biometric_gate` — that class's other assertions read
  # `strings.xml`. What a merged-manifest assertion catches is a library
  # contributing `FOREGROUND_SERVICE`, `USE_BIOMETRIC` or `allowBackup="true"`
  # with not a line changing in this project's own manifest. An AndroidX bump is
  # exactly how that arrives, and a bump arrives in a pull request.
  #
  # Its own job, and neither of the two places it looks like it belongs:
  #
  # - Not steps of `test`. That matrix is macOS + Windows, billed at 10x and 2x a
  #   Linux minute, and these assertions need neither OS. Adding them there
  #   installs an Android SDK, a pinned NDK and cargo-ndk twice and runs the same
  #   source set twice for one bit of information.
  # - Not steps of `build-android`. That job is
  #   `if: github.event_name != 'pull_request'`, which is precisely the event
  #   where the guard is wanted.
  #
  # No `needs`, so it starts alongside `test` rather than behind it: a manifest
  # guard says nothing about the desktop suite, and queueing behind a macOS
  # matrix would add that matrix's whole duration to the feedback loop for
  # nothing. `publish` needs this job, so no signed APK is released past a failed
  # guard. `build-android` deliberately does *not* — see the note there.
  android-guards:
    name: Android guards (JVM)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          # AndroidX, Compose and the wrapper itself are a hundred-odd downloads
          # this job would otherwise repeat every run. `build-android` is left
          # uncached on purpose: its cost is the release cross-compile and
          # packaging rather than dependency resolution, and two jobs writing one
          # cache key is a race bought for nothing.
          cache: gradle

      # The same pin, for the same reason, as `build-android`: the NDK is a
      # compile-time input to every `.so` and the runner image's default moves
      # between image releases. `build-tools` tracks `buildToolsVersion` in the
      # Gradle build.
      - name: Install the pinned Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          # A here-string, never a pipe — see the same step in `build-android`
          # for why `yes |` fails under `pipefail` and a bounded producer does too.
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            'ndk;27.2.12479018' 'platforms;android-35' 'build-tools;36.0.0' \
            <<< "$(printf 'y\n%.0s' $(seq 1 50))"

      # A JVM test still needs the native library built. `testDebugUnitTest`
      # depends on `compileDebugKotlin`, which consumes the UniFFI bindings,
      # which are generated out of a *built* `libsharepaste_ffi.so` — see
      # `generateUniffiBindingsDebug` in `clients/mobile/android/app/build.gradle.kts`.
      # So the guards are cheap but their prerequisite is not, and this job
      # carries the same Rust toolchain as `build-android`. There is no shortcut:
      # a unit test that cannot compile the variant cannot run.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked

      # No keystore and no `-Psharepaste.ffi.features`: this is the debug
      # variant, which builds unsigned and with the `testing` feature on, and
      # neither is anything these tests read.
      #
      # `:app:compileDebugAndroidTestKotlin` is the second half of the point. The
      # 104 instrumented tests only ever run on a developer's emulator, so
      # compiling them here is the difference between a broken instrumented suite
      # being found now and being found by whoever next boots an AVD. It costs
      # one Kotlin compile against a variant this job has already built.
      #
      # `sh gradlew`, not `./gradlew`: Git on Windows does not record an exec
      # bit, so a re-add of the wrapper from a Windows checkout silently drops
      # mode 100755 and CI fails with "Permission denied" before Gradle is
      # reached — a CI-only error that reads like a runner problem. The mode is
      # correct in the index today; this is what keeps it from mattering when it
      # is not. The wrapper's shebang is `#!/bin/sh`, so this is equivalent.
      # `build-android` does the same, for the same reason.
      - name: Run the Android JVM tests and compile the instrumented sources
        working-directory: clients/mobile/android
        run: sh gradlew --no-daemon :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin

      # Gradle's console prints the failing test's name and none of its message,
      # and for these tests the message *is* the finding — "the merged manifest
      # declares android.permission.FOREGROUND_SERVICE" is the whole value of the
      # run. Without the report a red guard says only which line threw.
      #
      # `warn`, not `error`: a failure in the Kotlin compile above produces no
      # test report at all, and that must not be reported as a missing artifact.
      - name: Upload the test report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-guard-report
          path: clients/mobile/android/app/build/reports/tests/testDebugUnitTest
          if-no-files-found: warn

  # The Android artifact. A separate job rather than a third entry in `build`'s
  # matrix: it needs the Android SDK, a pinned NDK and two Rust
  # cross-compilation targets, and none of that belongs on a runner whose job is
  # to bundle a desktop app.
  #
  # Ubuntu on purpose. The desktop crate compiles only on macOS and Windows —
  # `keyring` is declared for those two targets — but nothing here builds the
  # desktop crate. `sharepaste-core` and `sharepaste-ffi` cross-compile to
  # Android from any host, so this takes the cheapest minute available.
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: test
    # Same reasoning as `build`: an artifact nobody consumes from a pull
    # request. `test` and `android-guards` are what gate the merge.
    #
    # Not `needs: android-guards`, deliberately. Both jobs cross-compile
    # sharepaste-ffi for two ABIs, so chaining them would put one Android
    # cross-compile in front of the other and buy nothing: `publish` already
    # needs `android-guards`, so a failed guard cannot release this APK however
    # cleanly it built.
    if: github.event_name != 'pull_request'

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 25

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # The exact NDK the Gradle build pins (`ndkVersionPinned`), installed
      # rather than assumed: the runner image's default NDK moves between image
      # releases, and the NDK is a compile-time input to every `.so` in the APK.
      - name: Install the pinned Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          # A here-string, never a pipe. sdkmanager stops reading stdin as soon
          # as it has its answers — and reads none at all when the licences are
          # already accepted — so any producer piped into it dies of SIGPIPE and
          # `pipefail` turns that into a failed step. Seen for real on the first
          # CI run: "yes: standard output: Broken pipe", exit 1, after the NDK
          # had unzipped to 100%. A bounded `printf` is NOT a fix; measured, it
          # still exits 141, because the race is when the reader closes the pipe
          # rather than how much the writer had left to write. A here-string is
          # a file descriptor, so there is no pipe to break. `integration-filter`
          # below records the same trap from the other direction.
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            'ndk;27.2.12479018' 'platforms;android-35' 'build-tools;36.0.0' \
            <<< "$(printf 'y\n%.0s' $(seq 1 50))"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # The two ABIs the release carries. `armeabi-v7a` and `x86` are
          # excluded on purpose; see `shippedAbis` in the Gradle build.
          targets: aarch64-linux-android,x86_64-linux-android

      # Version-pinned and `--locked`: this program chooses the linker and the
      # sysroot for the library that ships, so "whatever released this morning"
      # is not an acceptable answer for what built it.
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked

      # The keystore is a secret and never a file in this repository. It is
      # decoded into the runner's temp directory, which the runner takes with it.
      #
      # The emptiness check is not defensive padding: an unset secret expands to
      # an empty string, `base64 -d` of which is a zero-byte file that exists, so
      # Gradle would accept it as a keystore and fail several tasks later with a
      # message about a truncated archive.
      - name: Materialise the release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo 'ANDROID_KEYSTORE_BASE64 is not set. An unsigned APK cannot install over' >&2
            echo 'or be updated by a signed one, so this is a failure and not a fallback.' >&2
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks"

      # Prove the four secrets open the keystore before spending nine minutes
      # cross-compiling two ABIs to find out. AGP checks them in
      # `:app:packageRelease`, which is the *last* task in the build, so a wrong
      # password costs a full run and reports itself from inside a Gradle worker
      # as "Failed to read key *** from store" — accurate, and buried.
      #
      # Seen for real on the first push to main after the secrets were added.
      #
      # What it proves, measured rather than assumed against scratch keystores.
      #
      # `keytool -list` rejects a wrong store password and a wrong alias. It does
      # NOT validate the key password — for a JKS it falls back to the store
      # password for the entry, and `-certreq` and `-importkeystore` behave the
      # same. `jarsigner` refuses even correct credentials on JDK 25, so it is no
      # use as a probe either.
      #
      # The PKCS12 comparison below covers the gap for every keystore made this
      # decade. `keytool -genkeypair` has defaulted to PKCS12 since JDK 9, and
      # PKCS12 cannot hold a separate key password — keytool prints "Different
      # store and key passwords not supported for PKCS12 KeyStores. Ignoring
      # user-specified -keypass value" and stores the key under the store
      # password. So for a PKCS12 store the two secrets MUST match, and if they
      # do not, AGP fails in `packageRelease` with "Get Key failed: Given final
      # block not properly padded". That is exactly how this was found: a
      # nine-minute build to learn that two secrets disagreed.
      #
      # A genuine JKS with a mismatched key password is still only caught late.
      # It would have to have been made deliberately, with `-storetype jks`.
      #
      # Output is captured, not printed: a successful listing prints the
      # certificate fingerprint, and nothing about a signing key belongs in a
      # public log. Both streams go to the file, because keytool does not put all
      # of its diagnostics on stderr.
      - name: Check the signing credentials open the keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "$name is not set; the release APK would build unsigned." >&2
              exit 1
            fi
          done

          # Two invocations, because `-list` prints "Keystore type:" only when it
          # lists the whole store — add `-alias` and the output is just that one
          # entry, with or without `-v`. Measured; the single-call version of this
          # step extracted an empty type and the guard below silently never fired.
          if ! keytool -list \
                 -keystore "$RUNNER_TEMP/release.jks" \
                 -storepass "$ANDROID_KEYSTORE_PASSWORD" \
                 >"$RUNNER_TEMP/keytool.out" 2>&1; then
            echo 'ANDROID_KEYSTORE_PASSWORD does not open the keystore.' >&2
            echo 'keytool said:' >&2
            sed 's/^/  /' "$RUNNER_TEMP/keytool.out" >&2
            echo >&2
            echo 'Often a trailing newline rather than a wrong password:' >&2
            echo '`echo pw | gh secret set X` stores "pw\n". Re-set with `gh secret set X`' >&2
            echo 'on its own, which prompts, or `printf %s "$pw" | gh secret set X`.' >&2
            exit 1
          fi
          store_type="$(sed -n 's/^Keystore type: *//p' "$RUNNER_TEMP/keytool.out" | head -1)"

          if ! keytool -list \
                 -keystore "$RUNNER_TEMP/release.jks" \
                 -storepass "$ANDROID_KEYSTORE_PASSWORD" \
                 -alias "$ANDROID_KEY_ALIAS" \
                 >"$RUNNER_TEMP/alias.out" 2>&1; then
            echo "ANDROID_KEY_ALIAS ($ANDROID_KEY_ALIAS) is not in the keystore." >&2
            sed 's/^/  /' "$RUNNER_TEMP/alias.out" >&2
            exit 1
          fi

          # A PKCS12 store keeps the key under the store password, so two
          # different secrets cannot both be right.
          if [ "${store_type^^}" = 'PKCS12' ] \
             && [ "$ANDROID_KEY_PASSWORD" != "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo 'This keystore is PKCS12, which cannot hold a separate key password:' >&2
            echo 'keytool ignores -keypass for PKCS12 and stores the key under the store' >&2
            echo 'password. ANDROID_KEY_PASSWORD and ANDROID_KEYSTORE_PASSWORD therefore have' >&2
            echo 'to be the same value, and they are not.' >&2
            echo >&2
            echo 'Set ANDROID_KEY_PASSWORD to the store password:' >&2
            echo '  printf %s "$store_password" | gh secret set ANDROID_KEY_PASSWORD' >&2
            echo >&2
            echo 'Left alone, AGP fails in :app:packageRelease with' >&2
            echo '"Get Key failed: Given final block not properly padded".' >&2
            exit 1
          fi

          echo "Signing credentials verified against the keystore (${store_type:-type unknown})."

      # One universal APK carrying both shipped ABIs. The `testing` Cargo feature
      # is off in this variant by the build file's own decision, not by a flag
      # passed here — see `ffiFeaturesFor`.
      - name: Build the signed universal APK
        working-directory: clients/mobile/android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: sh gradlew --no-daemon :app:assembleRelease

      # AGP calls it `app-release.apk`, which is not a name to put on a Release
      # page beside five desktop bundles. Two things are load-bearing here:
      #
      # - The version comes from `tauri.conf.json`, the authority
      #   `check-versions.mjs` has already proved the Gradle `versionName` agrees
      #   with, so this cannot name the APK a version it is not.
      # - `app-release.apk` is the *signed* name. AGP writes
      #   `app-release-unsigned.apk` when it has no signing config, so this
      #   `test -f` is also the assertion that the secrets took effect.
      #
      # `-universal` rather than an ABI in the name: Obtainium has a per-app
      # setting that tries to pick an APK by CPU architecture out of the file
      # name, and a name carrying `arm64` would invite it to guess. There is one
      # APK and it runs everywhere.
      - name: Name the artifact
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./clients/desktop/src-tauri/tauri.conf.json').version")"
          built=clients/mobile/android/app/build/outputs/apk/release/app-release.apk
          test -f "$built"
          mkdir -p android-artifact
          cp "$built" "android-artifact/sharepaste-$version-universal.apk"

      - name: Upload the Android artifact
        uses: actions/upload-artifact@v7
        with:
          name: sharepaste-android
          path: android-artifact/*.apk
          if-no-files-found: error

  # Opt-in: the live-server tests need a relay to talk to, so they run on
  # workflow_dispatch and on pushes that touch the client's HTTP or pairing
  # code. A release commit runs them whatever it touched, because `publish`
  # needs this job and "the tests did not apply" is not evidence.
  integration-filter:
    name: Decide whether to run integration tests
    runs-on: ubuntu-latest
    needs: release-gate
    outputs:
      run: ${{ steps.decide.outputs.run }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Decide
        id: decide
        shell: bash
        run: |
          # No pipefail: `grep -q` exiting early can SIGPIPE `git diff`, and a
          # match must not be misread as a failed pipeline.
          set -eu

          if [ '${{ needs.release-gate.outputs.publish }}' = 'true' ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            echo 'Release commit; integration tests run regardless of paths.'
            exit 0
          fi

          # Pick the commit to diff against: the pushed-from SHA, or the PR base.
          # Without the pull_request arm every PR would fall through to the
          # always-run branch below and spin up a relay it does not need.
          case '${{ github.event_name }}' in
            push)         base='${{ github.event.before }}' ;;
            pull_request) base='${{ github.event.pull_request.base.sha }}' ;;
            *)            base='' ;;
          esac

          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            # Manual dispatch, a new branch, or a force-push we cannot diff.
            echo 'run=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --name-only "$base" '${{ github.sha }}' \
               | grep -Eq '^clients/core/src/(http|pairing)/'; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
            echo 'No changes under core/http or core/pairing; integration tests skipped.'
          fi

  integration:
    name: Live-server integration tests
    # macOS, not ubuntu, and no Docker. The desktop crate only compiles on
    # macOS and Windows - `keyring` is declared for those two targets only, so
    # on Linux `core/keychain.rs` fails with "cannot find crate keyring". And
    # GitHub's macOS/Windows runners cannot run Linux containers, so the
    # compose stack is not an option either. Running the server as a plain node
    # process sidesteps both, and exercises the same wire contract.
    runs-on: macos-latest
    needs: integration-filter
    if: needs.integration-filter.outputs.run == 'true'

    env:
      SHAREPASTE_TEST_SERVER: http://127.0.0.1:8443
      SHAREPASTE_TEST_DB: ${{ github.workspace }}/ci-server.sqlite

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 25
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build the server
        run: npm --prefix server ci && npm --prefix server run build

      - name: Start the server
        run: |
          DB_PATH="$SHAREPASTE_TEST_DB" PORT=8443 \
            node server/dist/index.js serve > "$RUNNER_TEMP/server.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/server.pid"

      - name: Wait for the server to become healthy
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl -fsS "$SHAREPASTE_TEST_SERVER/healthz" >/dev/null 2>&1; then
              echo "server healthy after ${attempt}s"
              exit 0
            fi
            sleep 1
          done
          echo "server never answered /healthz within 60s" >&2
          exit 1

      # SHAREPASTE_TEST_CLI makes the harness invoke the operator CLI directly
      # instead of `docker exec`. It must open the same database file the
      # server was given, hence SHAREPASTE_TEST_DB above.
      - name: Run live-server integration tests
        env:
          SHAREPASTE_TEST_CLI: node ${{ github.workspace }}/server/dist/index.js
        run: |
          cargo test --manifest-path clients/core/Cargo.toml \
            --test flow1_invite --test flow2_pairing

      - name: Dump server log on failure
        if: failure()
        run: cat "$RUNNER_TEMP/server.log" || true

  # One job, both platforms, one release. A Windows failure means no release at
  # all rather than a published mac-only one that looks complete.
  #
  # `needs` carries the whole gate: on a non-release commit `integration` is
  # skipped, which skips this job, which is the wanted outcome — so no
  # `always()` or `!cancelled()` is needed anywhere.
  #
  # `android-guards` is in that list rather than in `build-android`'s: it runs
  # concurrently with every other dependency here, so it refuses the release
  # without adding a minute to the path that produces it.
  publish:
    name: Publish v${{ needs.release-gate.outputs.version }}
    runs-on: ubuntu-latest
    needs: [release-gate, build, build-android, android-guards, integration]
    if: needs.release-gate.outputs.publish == 'true'

    # Scoped to this job alone; the workflow default stays `contents: read`.
    permissions:
      contents: write

    env:
      VERSION: ${{ needs.release-gate.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 25

      - name: Download every platform's artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          # Both jobs' names start with this, and the per-pattern check in
          # "Upload every asset" is what notices if one of them contributed
          # nothing.
          pattern: sharepaste-*

      - name: Extract the release notes
        run: node .github/scripts/changelog.mjs clients/desktop/CHANGELOG.md "$VERSION" > notes.md

      # Hand-rolled rather than tauri-action's `includeUpdaterJson`; the script
      # explains why at its head. One job writes the manifest once, with both
      # platforms already on disk.
      - name: Assemble latest.json
        run: |
          node .github/scripts/build-latest-json.mjs \
            --version "$VERSION" \
            --repo '${{ github.repository }}' \
            --notes-file notes.md \
            --artifacts artifacts \
            --out latest.json

      # Draft first. `releases/latest/download/latest.json` is polled
      # continuously by every device, so a manifest that becomes reachable
      # before the bundles it names is a manifest pointing at 404s.
      - name: Create the draft release
        run: |
          set -euo pipefail
          cat .github/release-body-header.md notes.md > body.md
          gh release create "v$VERSION" \
            --draft \
            --title "v$VERSION" \
            --notes-file body.md \
            --target '${{ github.sha }}'

      - name: Upload every asset
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          # One match per pattern, or no release. A half-built release —
          # published, plausible, and missing a platform — is worse than none,
          # and this is the only step that would notice. It has already earned
          # its keep once, on exactly that mistake.
          #
          # `*.apk` is the Android artifact, and it belongs in this list rather
          # than in a separate `gh release upload` beside it: a phone missing
          # from a Release that names it is the same failure as a missing
          # desktop bundle, and routing around the check is how it would stop
          # being caught.
          assets=()
          for pattern in '*.dmg' '*.app.tar.gz' '*.app.tar.gz.sig' \
                         '*.exe' '*.exe.sig' '*.apk'; do
            # shellcheck disable=SC2206 # $pattern is a glob; expanding it is the point.
            matches=(artifacts/**/$pattern)
            if [ "${#matches[@]}" -ne 1 ]; then
              printf 'expected exactly one %s, found %d\n' "$pattern" "${#matches[@]}" >&2
              exit 1
            fi
            assets+=("${matches[0]}")
          done
          gh release upload "v$VERSION" latest.json "${assets[@]}"

      # Not a prerelease, even at 0.x: the `releases/latest/download` redirect
      # resolves only to non-draft, non-prerelease releases, so flagging 0.x
      # honestly would 404 the updater permanently.
      - name: Publish the release
        run: gh release edit "v$VERSION" --draft=false --latest
