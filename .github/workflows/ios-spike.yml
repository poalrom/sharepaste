name: iOS spike (ticket 01)

# Nothing here ships. This workflow exists to answer whether the chain from
# Rust source to running code on an Apple target exists at all, and it is
# deleted once ticket 01 is closed and ticket 08 has a real job.
#
# Links 1 to 4 of the five are provable here. Link 5 — `xtool dev` onto the
# iPad — needs the device physically attached to WSL and stays with a human.

on:
  workflow_dispatch:
  push:
    branches:
      - ios-client
    paths:
      - .github/workflows/ios-spike.yml
      - clients/mobile/ffi/**
      - clients/core/**

permissions:
  contents: read

jobs:
  spine:
    name: Rust to a booted simulator
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      # A spike is iterated on. Three minutes of vendored SQLite per attempt is
      # the difference between finding all five answers today and finding one.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients

      - name: Show the toolchain this runner actually has
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          swift --version
          cc --version | head -1 || true

      # Link 1. The risk is `rusqlite`'s `bundled` feature: `libsqlite3-sys`
      # compiles vendored C SQLite through `cc`, so this needs a working C
      # toolchain and sysroot for the target and not merely a Rust one.
      - name: Link 1 — build the static library for both slices
        env:
          # rustc otherwise takes the deployment target from the SDK, which put
          # `minos 26.5` on the device slice — an app nothing in anyone's hands
          # could run. The floor is iOS 16, carried from the mobile-client
          # ledger, and it has to be said out loud for both slices.
          IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        run: |
          set -euo pipefail
          for target in aarch64-apple-ios aarch64-apple-ios-sim; do
            cargo build \
              --manifest-path clients/Cargo.toml \
              -p sharepaste-ffi \
              --release \
              --features testing \
              --target "$target"
          done

      - name: Link 1 — show what came out
        run: |
          set -euo pipefail
          for target in aarch64-apple-ios aarch64-apple-ios-sim; do
            lib="clients/target/$target/release/libsharepaste_ffi.a"
            echo "== $lib"
            ls -l "$lib"
            file "$lib"
            lipo -info "$lib"
            # The platform a slice was built for is not in `lipo -info`, and it
            # is what decides whether a simulator will load it: 2 is iOS, 7 is
            # the iOS simulator. `minos` is the deployment floor above.
            build_version=$(otool -l "$lib" | grep -A3 LC_BUILD_VERSION | head -8) || true
            echo "$build_version"
          done

      # Link 2. From the *built library*, never from the sources, which is what
      # makes a bindings/library mismatch impossible. Same rule the Android
      # build already follows.
      - name: Link 2 — Swift bindings from the built library
        # `cargo metadata` runs in the working directory, and the workspace is
        # `clients/`, not the repository root. The Android build resolves the
        # same thing with `workingDir = rustWorkspace`.
        working-directory: clients
        run: |
          set -euo pipefail
          mkdir -p ../spike/generated
          cargo run \
            --quiet \
            -p sharepaste-ffi --features cli --bin uniffi-bindgen \
            -- generate --language swift --no-format \
            --out-dir ../spike/generated \
            target/aarch64-apple-ios-sim/release/libsharepaste_ffi.a
          ls -l ../spike/generated

      - name: Link 3 — a minimal SwiftPM package, no xcframework and no xcodebuild
        run: |
          set -euo pipefail
          mkdir -p spike/Sources/sharepasteFFI spike/Sources/SharepasteCore spike/Sources/KatRunner spike/Vendor

          cp clients/target/aarch64-apple-ios-sim/release/libsharepaste_ffi.a spike/Vendor/
          cp spike/generated/sharepaste.swift spike/Sources/SharepasteCore/
          cp spike/generated/sharepasteFFI.h spike/Sources/sharepasteFFI/
          cp spike/generated/sharepasteFFI.modulemap spike/Sources/sharepasteFFI/module.modulemap

          cat > spike/Package.swift <<'SWIFT'
          // swift-tools-version:5.9
          import PackageDescription

          let package = Package(
              name: "Spike",
              platforms: [.iOS(.v16)],
              targets: [
                  .systemLibrary(name: "sharepasteFFI", path: "Sources/sharepasteFFI"),
                  .target(
                      name: "SharepasteCore",
                      dependencies: ["sharepasteFFI"],
                      path: "Sources/SharepasteCore",
                      linkerSettings: [
                          .unsafeFlags(["-L", "Vendor"]),
                          .linkedLibrary("sharepaste_ffi"),
                      ]
                  ),
                  .executableTarget(
                      name: "KatRunner",
                      dependencies: ["SharepasteCore"],
                      path: "Sources/KatRunner"
                  ),
              ]
          )
          SWIFT

          # The four `kat.rs` functions, asserted on the far side of the
          # boundary. Round-tripping encrypt into decrypt would pass under any
          # self-consistent cipher, including a wrong one, which is why the
          # pinned vector is decrypted rather than merely produced.
          cat > spike/Sources/KatRunner/main.swift <<'SWIFT'
          import Foundation
          import SharepasteCore

          var failures: [String] = []

          func check(_ name: String, _ condition: Bool, _ detail: @autoclosure () -> String = "") {
              if condition {
                  print("ok   \(name)")
              } else {
                  print("FAIL \(name) \(detail())")
                  failures.append(name)
              }
          }

          let wire = cryptoKatWire()
          check("crypto_kat_wire is nonce + ciphertext + tag", wire.count == 24 + 21, "got \(wire.count)")

          let expected = cryptoKatPlaintext()
          check("crypto_kat_plaintext is the vector's plaintext",
                Array(expected) == Array("hello".utf8),
                "got \(Array(expected))")

          do {
              let decrypted = try cryptoKatDecrypt(wire: wire)
              check("crypto_kat_decrypt reproduces the known answer", Array(decrypted) == Array(expected))
          } catch {
              check("crypto_kat_decrypt reproduces the known answer", false, "threw \(error)")
          }

          do {
              let fresh = try cryptoKatEncrypt(plaintext: expected)
              check("crypto_kat_encrypt draws a fresh nonce", Array(fresh) != Array(wire))
              let round = try cryptoKatDecrypt(wire: fresh)
              check("crypto_kat_encrypt output decrypts", Array(round) == Array(expected))
          } catch {
              check("crypto_kat_encrypt round-trips", false, "threw \(error)")
          }

          if failures.isEmpty {
              print("KAT OK")
              exit(0)
          }
          print("KAT FAILED: \(failures.joined(separator: ", "))")
          exit(1)
          SWIFT

          cd spike
          swift build \
            --configuration release \
            --triple arm64-apple-ios16.0-simulator \
            --sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)" \
            --product KatRunner
          find .build -name KatRunner -type f -perm +111 -print -exec file {} \;

      - name: Link 4 — run the vector in the simulator
        run: |
          set -euo pipefail
          xcrun simctl list runtimes
          udid=$(xcrun simctl create spike-phone \
            "$(xcrun simctl list devicetypes -j | python3 -c '
          import json,sys
          types = json.load(sys.stdin)["devicetypes"]
          print(next(t["identifier"] for t in types if "iPhone-16" in t["identifier"] or "iPhone-15" in t["identifier"]))
          ')")
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          binary=$(find spike/.build -name KatRunner -type f -perm +111 | head -1)
          echo "running $binary"
          xcrun simctl spawn "$udid" "$binary"
          xcrun simctl shutdown "$udid"
          xcrun simctl delete "$udid"

      # The device slice is what the desk links under WSL. Publishing it is how
      # the `.a`/`ld64.lld` seam — the one combination with no user base — gets
      # tried at all before an iPad is involved.
      - name: Publish both slices and the bindings
        uses: actions/upload-artifact@v4
        with:
          name: ios-spike-artifacts
          if-no-files-found: error
          path: |
            clients/target/aarch64-apple-ios/release/libsharepaste_ffi.a
            clients/target/aarch64-apple-ios-sim/release/libsharepaste_ffi.a
            spike/generated/
