<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <title>sharepaste</title>
  <!--
    Small-size variant of icon.svg for the 16/24/32/48 px .ico entries, the web
    favicon and the Windows tray. Same three-ribbon stack, redrawn on a 16-unit
    grid so every edge lands on a pixel boundary: 4px slab chamfered 2px, 1px
    gaps, filling y=1..15 of the canvas.

    The oldest ribbon is lifted from #0a6b47 to #0f8a5b: with no plate behind
    it the slab sits directly on the taskbar, where the reference green is too
    close to a dark background to separate at 3px tall.
  -->
  <polygon points="7,1 14,1 14,3 12,5 5,5 5,3" fill="#3dffa4"/>
  <polygon points="6,6 13,6 13,8 11,10 4,10 4,8" fill="#12c47a"/>
  <polygon points="5,11 12,11 12,13 10,15 3,15 3,13" fill="#0f8a5b"/>
</svg>
