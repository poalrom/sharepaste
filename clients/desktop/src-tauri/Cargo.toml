[package]
name = "sharepaste-desktop"
version = "0.8.1"
edition = "2021"
rust-version = "1.78"

[lib]
name = "sharepaste_desktop_lib"
path = "src/lib.rs"

[[bin]]
name = "sharepaste-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
sharepaste-core = { path = "../../core" }
tauri = { version = "2", features = [ "tray-icon", "macos-private-api"] }
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
rusqlite = { version = "0.32", features = ["bundled"] }
zeroize = { version = "1", features = ["zeroize_derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
dirs = "5"
parking_lot = "0.12"
async-trait = "0.1"
tauri-plugin-updater = "2"

[target.'cfg(target_os = "macos")'.dependencies]
clipboard-master = "4"
arboard = "3"
objc2 = "0.5"
objc2-foundation = { version = "0.2", features = ["NSEnumerator", "NSThread"] }
objc2-app-kit = { version = "0.2", features = ["NSPasteboard", "NSWorkspace", "NSRunningApplication", "NSScreen", "NSStatusBar", "NSGraphics"] }
core-foundation = "0.10"
core-graphics = "0.25"

[target.'cfg(target_os = "windows")'.dependencies]
clipboard-master = "4"
arboard = "3"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
# `testing` exposes the core's in-memory database opener. The session loop's
# tests live here because the session loop does; ticket 04 moves both.
sharepaste-core = { path = "../../core", features = ["testing"] }
tokio = { version = "1", features = ["full", "test-util"] }
tempfile = "3"
